[package]
name = "zephyr-translator"
version = "0.1.0"
description = "跨端桌面 AI 翻译工具"
edition = "2021"
rust-version = "1.77"

[lib]
name = "zephyr_translator_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.13", default-features = false, features = [
  "rustls",
  "json",
  "charset",
] }
tokio = { version = "1", features = ["full"] }
keyring = { version = "3.6", features = ["windows-native", "sync-secret-service"] }
encoding_rs = "0.8"
rusqlite = { version = "0.32", features = ["bundled"] }
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
dirs = "5"
tauri-plugin-global-shortcut = "2"
tauri-plugin-autostart = "2"
rdev = "0.5.3"
arboard = "3.6.1"
scraper = "0.27.0"

[target.'cfg(windows)'.dependencies]
uiautomation = { version = "0.25.1", default-features = false, features = ["control", "input", "pattern"] }
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_UI_WindowsAndMessaging",
] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
